name: Verificación de producción

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-production.yml"
      - "base-de-tareas/scripts/smoke-production.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probar aplicación desplegada
        working-directory: base-de-tareas
        env:
          BASE_URL: https://basedetareas.vercel.app
        run: node scripts/smoke-production.mjs
